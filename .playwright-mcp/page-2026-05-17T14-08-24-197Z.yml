        - heading "智慧視障導航系統" [level=3] [ref=e2625]
        - generic [ref=e2626]: 通訊工程學系
        - generic [ref=e2627]:
          - generic [ref=e2628]:
            - generic [ref=e2629]: 研究動機與問題
            - generic [ref=e2630]: 本研究旨在解決視障人士在日常生活中因視覺功能缺失而面臨的行動困難與安全隱患問題。傳統的導盲工具如導盲杖雖能提供基本的導航功能，但無法適應多變的環境需求，且缺乏智能化的解決方案。研究者認為，透過結合物體檢測技術與邊緣運算，可以開發出一套智能化的視障導航系統，提升視障人士的生活質量與自主性。
          - generic [ref=e2631]:
            - generic [ref=e2632]: 研究方法
            - generic [ref=e2633]: 研究者設計了一套名為Foreseer的系統，結合了tiny-YOLO模型、Raspberry Pi 3硬體平台及專屬APP界面。該系統利用語音輸入與手勢操作，結合超音波感測器與影像辨識技術，實時檢測周遭環境中的障礙物與重要物件（如門、椅子等），並透過語音提示引導使用者安全行進。系統還能在室內環境中辨識特定物件，進一步提升導航的精準度與便利性。
          - generic [ref=e2634]:
            - generic [ref=e2635]: 研究成果
            - generic [ref=e2636]: 研究已成功開發出Foreseer系統的原型，並實現了初步功能，包括多物件檢測與語音導航。系統能辨識多達十四類物件，並提供即時的避障與導航服務。未來，研究者計劃進一步優化物體檢測技術，提升辨識速度與準確性，並根據視障人士的實際需求改進導航路徑的設計，最終目標是開發出一套真正友善且實用的智能導航系統。
